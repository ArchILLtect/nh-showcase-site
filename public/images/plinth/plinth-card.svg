<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Plinth</title>
  <desc id="description">A visual identity for Plinth, a configurable small-business platform in development.</desc>
  <defs>
