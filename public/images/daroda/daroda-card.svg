    <path d="M0 50h450" stroke="#9aa690" stroke-width="2"/>
    <text x="0" y="132" fill="#26352d" font-family="Georgia, serif" font-size="55" font-weight="600">A full-stack</text>
    <text x="0" y="196" fill="#26352d" font-family="Georgia, serif" font-size="55" font-weight="600">website rebuild</text>
    <text x="2" y="244" fill="#566453" font-family="Arial, sans-serif" font-size="21">Wix → React • Public site • CRM-lite • Serverless APIs</text>
