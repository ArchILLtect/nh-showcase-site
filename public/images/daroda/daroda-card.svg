<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Daroda Accounting website rebuild</title>
  <desc id="description">A portfolio illustration showing the Daroda Accounting website rebuilt in React, with its original design credited to Brandy Riley.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f0e7"/>
      <stop offset="1" stop-color="#e5e9df"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f8f6ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#paper)"/>
  <circle cx="1050" cy="140" r="230" fill="#789078" opacity=".10"/>
  <path d="M0 560c210-66 360-49 550-9s385 33 650-61v185H0Z" fill="#657d68" opacity=".10"/>
